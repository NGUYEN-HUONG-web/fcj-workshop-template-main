<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc giám sát và tự động hóa AWS</title>
  <desc id="desc">CloudWatch và AWS Budgets gửi cảnh báo qua SNS; SNS và EventBridge kích hoạt Lambda để thực hiện hành động tự động.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#13293d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#34495e"/>
    </marker>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .node { fill: #fff; stroke-width: 2.5; rx: 22; filter: url(#shadow); }
      .node-name { font: 700 30px Inter, "Segoe UI", Arial, sans-serif; fill: #162a3a; text-anchor: middle; }
      .node-desc { font: 500 18px Inter, "Segoe UI", Arial, sans-serif; fill: #5f7080; text-anchor: middle; }
      .flow { fill: none; stroke: #34495e; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .flow-label { font: 650 19px Inter, "Segoe UI", Arial, sans-serif; fill: #29445a; text-anchor: middle; }
      .pill { fill: #fff; stroke: #d9e3ec; stroke-width: 1.5; rx: 18; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M65 109 C65 67 98 35 140 35 H1460 C1502 35 1535 67 1535 109 V791 C1535 833 1502 865 1460 865 H140 C98 865 65 833 65 791 Z" fill="#fff" stroke="#c8d6e2" stroke-width="3"/>

  <text x="800" y="105" class="font" text-anchor="middle" font-size="38" font-weight="750" fill="#152b3c">Kiến trúc giám sát và tự động hóa</text>
  <text x="800" y="143" class="font" text-anchor="middle" font-size="20" fill="#667988">Theo dõi vận hành • Cảnh báo chi phí • Tự động tối ưu tài nguyên</text>

  <!-- Flow lines behind nodes -->
  <path class="flow" d="M410 300 H630"/>
  <path class="flow" d="M410 650 C515 650 520 430 630 385"/>
  <path class="flow" d="M930 330 C1040 330 1050 535 1165 580"/>
  <path class="flow" d="M930 650 H1165"/>

  <!-- Labels -->
  <g transform="translate(520 267)">
    <rect class="pill" x="-94" y="-20" width="188" height="40"/>
    <text class="flow-label" y="7">Cảnh báo vận hành</text>
  </g>
  <g transform="translate(515 530)">
    <rect class="pill" x="-82" y="-20" width="164" height="40"/>
    <text class="flow-label" y="7">Cảnh báo chi phí</text>
  </g>
  <g transform="translate(1055 420)">
    <rect class="pill" x="-78" y="-20" width="156" height="40"/>
    <text class="flow-label" y="7">Kích hoạt Lambda</text>
  </g>
  <g transform="translate(1048 617)">
    <rect class="pill" x="-72" y="-20" width="144" height="40"/>
    <text class="flow-label" y="7">Lịch vận hành</text>
  </g>

  <!-- CloudWatch -->
  <g>
    <rect class="node" x="120" y="205" width="290" height="190" stroke="#d12b70"/>
    <rect x="120" y="205" width="290" height="78" rx="20" fill="#d12b70"/>
    <path d="M225 252 h19 l9-22 16 45 11-23 h25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="264" cy="244" r="31" fill="none" stroke="#fff" stroke-width="5" opacity=".45"/>
    <text x="265" y="335" class="node-name">CloudWatch</text>
    <text x="265" y="368" class="node-desc">Metrics • Logs • Alarms</text>
  </g>

  <!-- AWS Budgets -->
  <g>
    <rect class="node" x="120" y="555" width="290" height="190" stroke="#4d8f3a"/>
    <rect x="120" y="555" width="290" height="78" rx="20" fill="#4d8f3a"/>
    <path d="M225 608 v-23 h18 v23 M251 608 v-39 h18 v39 M277 608 v-54 h18 v54" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="310" cy="574" r="20" fill="#fff" opacity=".18"/>
    <text x="310" y="582" class="font" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">$</text>
    <text x="265" y="685" class="node-name">AWS Budgets</text>
    <text x="265" y="718" class="node-desc">Actual • Forecast • Threshold</text>
  </g>

  <!-- SNS -->
  <g>
    <rect class="node" x="630" y="235" width="300" height="190" stroke="#c52478"/>
    <rect x="630" y="235" width="300" height="78" rx="20" fill="#c52478"/>
    <circle cx="780" cy="274" r="27" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M780 247 v54 M753 274 h54" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="780" cy="247" r="6" fill="#fff"/><circle cx="807" cy="274" r="6" fill="#fff"/><circle cx="780" cy="301" r="6" fill="#fff"/><circle cx="753" cy="274" r="6" fill="#fff"/>
    <text x="780" y="365" class="node-name">SNS</text>
    <text x="780" y="398" class="node-desc">Thông báo tập trung</text>
  </g>

  <!-- EventBridge -->
  <g>
    <rect class="node" x="630" y="555" width="300" height="190" stroke="#c52478"/>
    <rect x="630" y="555" width="300" height="78" rx="20" fill="#c52478"/>
    <circle cx="747" cy="594" r="9" fill="#fff"/><circle cx="780" cy="575" r="9" fill="#fff"/><circle cx="813" cy="594" r="9" fill="#fff"/><circle cx="780" cy="613" r="9" fill="#fff"/>
    <path d="M755 589 L772 580 M788 580 L805 589 M805 599 L788 608 M772 608 L755 599" stroke="#fff" stroke-width="5" fill="none"/>
    <text x="780" y="685" class="node-name">EventBridge</text>
    <text x="780" y="718" class="node-desc">Scheduler • Event rules</text>
  </g>

  <!-- Lambda -->
  <g>
    <rect class="node" x="1165" y="505" width="300" height="220" stroke="#ed7d00"/>
    <rect x="1165" y="505" width="300" height="88" rx="20" fill="#ed7d00"/>
    <path d="M1292 568 l27-42 h20 l37 58 h-23 l-25-39-16 23 z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
    <text x="1315" y="645" class="node-name">Lambda</text>
    <text x="1315" y="680" class="node-desc">Start / Stop EC2</text>
    <text x="1315" y="706" class="node-desc">Hành động tự động</text>
  </g>

  <g transform="translate(1185 200)">
    <rect width="270" height="120" rx="18" fill="#f4f8fb" stroke="#d5e0e9" stroke-width="2"/>
    <text x="24" y="36" class="font" font-size="17" font-weight="700" fill="#29445a">KẾT QUẢ</text>
    <text x="24" y="68" class="font" font-size="18" fill="#536878">• Phát hiện sự cố sớm</text>
    <text x="24" y="97" class="font" font-size="18" fill="#536878">• Kiểm soát chi phí AWS</text>
  </g>
</svg>
